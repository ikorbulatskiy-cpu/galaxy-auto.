name: NEXORA 2D Room CI

on:
  push:
    branches: [nexora-social-mvp]
    paths:
      - "prototypes/nexora-social-mvp/public/**"
      - ".github/workflows/nexora-room-ci.yml"
  pull_request:
    branches: [nexora-social-mvp]

jobs:
  validate-2d-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: |
          node --check prototypes/nexora-social-mvp/public/app.js
          node --check prototypes/nexora-social-mvp/public/sprite-engine.js
          node --check prototypes/nexora-social-mvp/public/world-scene.js
          node --check prototypes/nexora-social-mvp/public/world-objects.js
      - name: Validate 2D art assets
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('prototypes/nexora-social-mvp/public/assets/sprites/characters/nexora-avatar-atlas.svg')"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('prototypes/nexora-social-mvp/public/assets/sprites/planets/starter.svg')"
      - name: Verify minimal 2D room and existing auth integration
        run: |
          node <<'NODE'
          const fs = require("fs");
          const root = "prototypes/nexora-social-mvp/public/";
          const html = fs.readFileSync(root + "index.html", "utf8");
          const app = fs.readFileSync(root + "app.js", "utf8");
          const checks = [
            [html.includes('id="intro-canvas"') && html.includes('id="open-register"') && html.includes('id="open-login"'), "2D welcome screen and two entry buttons exist"],
            [html.includes('id="register-step-one"') && html.includes('id="register-step-two"') && html.includes('id="step-label"'), "registration has two visible steps"],
            [html.includes('id="login-nickname"') && html.includes('id="login-code"'), "login is separate and uses nickname plus recovery code"],
            [html.includes('id="room-canvas"') && html.includes('id="room-screen"'), "the 2D room canvas exists"],
            [html.includes('/sprite-engine.js') && html.includes('/world-scene.js') && html.includes('/world-objects.js'), "2D scene and character renderers are loaded"],
            [app.includes('fetch("/api/auth/register"') && app.includes('fetch("/api/auth/login"') && app.includes('fetch("/api/auth/me"'), "existing PostgreSQL-backed auth endpoints are retained"],
            [app.includes('NexoraSpriteEngine.draw') && app.includes('NexoraWorldScene.draw') && app.includes('NexoraWorldObjects.get'), "room uses original 2D scene, props and character sprites"],
            [app.includes('data-move') && app.includes('ArrowUp') && app.includes('pointerdown'), "keyboard and touch movement are wired"]
          ];
          for (const [ok, label] of checks) console.log((ok ? "PASS " : "FAIL ") + label);
          if (checks.some(([ok]) => !ok)) process.exit(1);
          NODE
