name: NEXORA Room Redesign CI

on:
  pull_request:
    branches: [nexora-social-mvp]
  push:
    branches: [nexora-social-mvp]
    paths:
      - "prototypes/nexora-social-mvp/public/**"
      - "prototypes/nexora-social-mvp/server.js"
      - "prototypes/nexora-social-mvp/src/profile.js"
      - "prototypes/nexora-social-mvp/src/**"
      - "prototypes/nexora-social-mvp/migrations/**"
      - ".github/workflows/nexora-room-ci.yml"

jobs:
  room-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: cd prototypes/nexora-social-mvp && npm install
      - name: Check JavaScript syntax
        run: |
          node --check prototypes/nexora-social-mvp/server.js
          node --check prototypes/nexora-social-mvp/src/profile.js
          node --check prototypes/nexora-social-mvp/src/economy.js
          node --check prototypes/nexora-social-mvp/src/planets.js
          node --check prototypes/nexora-social-mvp/src/social.js
          node --check prototypes/nexora-social-mvp/src/developer.js
          node --check prototypes/nexora-social-mvp/public/client.js
          node --check prototypes/nexora-social-mvp/public/sprite-engine.js
          node --check prototypes/nexora-social-mvp/public/world-objects.js
          node --check prototypes/nexora-social-mvp/public/world-scene.js
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('prototypes/nexora-social-mvp/public/assets/sprites/characters/nexora-avatar-atlas.svg')"
          python3 -c "import xml.etree.ElementTree as ET; [ET.parse('prototypes/nexora-social-mvp/public/assets/sprites/planets/' + name + '.svg') for name in ('starter','club','beach')]"
          node -e "JSON.parse(require('fs').readFileSync('prototypes/nexora-social-mvp/public/assets/sprites/characters/atlas.json','utf8'))"
      - name: Verify room features and server validation
        run: |
          node <<'NODE'
          const fs = require("fs");
          const root = "prototypes/nexora-social-mvp/";
          const html = fs.readFileSync(root + "public/index.html", "utf8");
          const css = fs.readFileSync(root + "public/style.css", "utf8");
          const spriteCss = fs.readFileSync(root + "public/sprite-overhaul.css", "utf8");
          const worldScene = fs.readFileSync(root + "public/world-scene.js", "utf8");
          const client = fs.readFileSync(root + "public/client.js", "utf8");
          const server = fs.readFileSync(root + "server.js", "utf8");
          const profile = fs.readFileSync(root + "src/profile.js", "utf8");
          const economy = fs.readFileSync(root + "src/economy.js", "utf8");
          const planets = fs.readFileSync(root + "src/planets.js", "utf8");
          const developer = fs.readFileSync(root + "src/developer.js", "utf8");
          const migration = fs.readFileSync(root + "migrations/011_economy_reports_planet_objects.sql", "utf8");
          const sprites = fs.readFileSync(root + "public/sprite-engine.js", "utf8");
          const atlas = fs.readFileSync(root + "public/assets/sprites/characters/nexora-avatar-atlas.svg", "utf8");
          const props = fs.readFileSync(root + "public/world-objects.js", "utf8");
          const checks = [
            [html.includes('id="world-canvas"') && html.includes('id="room-events-panel"'), "world canvas and event panel exist"],
            [html.includes('data-room-toggle="events"') && html.includes('id="room-player-search"'), "events control and player search exist"],
            [client.includes("function drawPlanetBackdrop") && client.includes("function drawAvatar"), "planet and character renderers exist"],
            [client.includes('socket.on("player:action:played"') && client.includes('socket.emit("player:action"'), "player action client flow exists"],
            [client.includes("function renderRoomEvents") && client.includes("setConnectionStatus"), "event feed and connection state exist"],
            [server.includes('socket.on("player:action"') && server.includes("sender.planet!==target.planet"), "player actions validate same planet"],
            [server.includes("lastActionAt") && server.includes("lastEmotionAt"), "action and emotion throttles exist"],
            [server.includes("hairColor: allowed.hairColor") && server.includes("accessory: allowed.accessory"), "server validates appearance fields"],
            [profile.includes("HAIR_COLORS.includes") && profile.includes("ACCESSORIES.includes"), "profile validates persisted appearance"],
            [css.includes("grid-template-columns:repeat(5") && css.includes("room-events-panel"), "five-control toolbar and event styles exist"],
            [html.includes('/sprite-engine.js') && html.includes('/world-objects.js'), "sprite and world-object engines are loaded"],
            [html.includes('/sprite-overhaul.css'), "mobile-first visual stylesheet is loaded"],
            [spriteCss.includes("prefers-reduced-motion") && spriteCss.includes("env(safe-area-inset-bottom)"), "mobile safe-area and reduced-motion styles exist"],
            [worldScene.includes("sceneAssets") && worldScene.includes("drawImage(art"), "illustrated planet backgrounds are loaded by scene renderer"],
            [sprites.includes("function animationFrames") && sprites.includes("drawImage(atlas"), "sprite atlas animation renderer exists"],
            [atlas.includes("sprite atlas") && atlas.includes("id=\"front\"") && atlas.includes("id=\"back\""), "original directional SVG sprite atlas exists"],
            [props.includes("function drawFountain") && props.includes("function drawPalm"), "planet prop library exists"],
            [client.includes("player.direction=") && client.includes("spriteDirection"), "four-direction movement drives sprite rendering"],
            [server.includes('app.use("/api/economy"') && economy.includes('router.post("/purchase"'), "transactional economy routes are mounted"],
            [economy.includes("FOR UPDATE") && economy.includes("wallet_transactions") && economy.includes("requestId"), "purchases lock balances and enforce idempotency"],
            [economy.includes('router.post("/equip"') && economy.includes('router.post("/reports"'), "inventory equip and player reports endpoints exist"],
            [planets.includes('router.put("/:id/objects"') && planets.includes("OBJECT_CODES"), "custom planet object editor validates owner-saved objects"],
            [migration.includes("wallet_transactions") && migration.includes("custom_planet_objects") && migration.includes("player_reports"), "additive 011 economy and world migration exists"],
            [planets.includes("AND ($1='' OR p.name ILIKE '%'||$1||'%')") && !planets.includes("AND ($1=' OR"), "custom planet catalog search uses a valid empty-query predicate"],
            [developer.includes(String.raw\`/^\d+$/.test\`) && !developer.includes(String.raw\`/^\\d+$/.test\`), "developer moderation and planet IDs use decimal-only validation"]
          ];
          for (const [ok, label] of checks) console.log((ok ? "PASS " : "FAIL ") + label);
          if (checks.some(([ok]) => !ok)) process.exit(1);
          NODE

  migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations to a clean temporary PostgreSQL
        env:
          PGPASSWORD: nexora_test_password
        run: |
          set -euo pipefail
          for file in prototypes/nexora-social-mvp/migrations/*.sql; do
            echo "Applying $file"
            psql -h 127.0.0.1 -U nexora -d nexora_test -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -h 127.0.0.1 -U nexora -d nexora_test -v ON_ERROR_STOP=1 -c "SELECT item_code, price FROM nexora_social_world.shop_catalog ORDER BY item_code"
          psql -h 127.0.0.1 -U nexora -d nexora_test -v ON_ERROR_STOP=1 -c "SELECT to_regclass('nexora_social_world.custom_planet_objects'), to_regclass('nexora_social_world.player_reports'), to_regclass('nexora_social_world.wallet_transactions')"
