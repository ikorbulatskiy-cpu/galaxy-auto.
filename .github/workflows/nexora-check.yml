name: NEXORA backend checks

on:
  push:
    branches:
      - love-galaxy-redesign
  pull_request:
    branches:
      - love-galaxy-redesign

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check server and API syntax
        run: |
          node --check server.js
          for file in src/*.js scripts/*.js; do
            node --check "$file"
          done
      - name: Check browser client syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline client script found")
          Path("/tmp/nexora-client.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/nexora-client.js
      - name: Run structural tests
        run: npm test
