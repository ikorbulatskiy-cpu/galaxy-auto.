name: NEXORA Social World checks

on:
  push:
    branches:
      - nexora-social-persistence
      - nexora-social-mvp
    paths:
      - "prototypes/nexora-social-mvp/**"
      - ".github/workflows/nexora-social-check.yml"
  pull_request:
    branches:
      - nexora-social-persistence
      - nexora-social-mvp

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/nexora-social-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install application dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check src/db.js
          node --check src/auth.js
          node --check src/social.js
          node --check src/profile.js
          node --check public/client.js
      - name: Verify migration sequence and social repair tables
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const dir = path.join(process.cwd(), "migrations");
          const files = fs.readdirSync(dir)
            .filter(name => /^\d+.*\.sql$/i.test(name))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          for (const required of ["001_nexora_social_world.sql", "002_social_messaging.sql", "003_repair_social_graph.sql", "004_profile_progression.sql", "005_auth_login_rate_limit.sql"]) {
            if (!files.includes(required)) throw new Error("Missing migration: " + required);
          }
          const repair = fs.readFileSync(path.join(dir, "003_repair_social_graph.sql"), "utf8");
          for (const table of ["friend_requests", "user_blocks", "conversations", "direct_messages", "notifications"]) {
            if (!repair.includes("nexora_social_world." + table)) {
              throw new Error("Repair migration does not create " + table);
            }
          }
          console.log("Migration sequence verified:", files.join(", "));
          NODE
      - name: Verify social module loads
        run: node -e "require('./src/social'); require('./src/profile')"
