name: NEXORA rebuild checks
on:
  push:
    branches: [nexora-rebuild]
  pull_request:
    branches: [nexora-rebuild]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
