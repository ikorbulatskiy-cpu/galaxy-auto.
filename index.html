
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d1c">
<title>Galaxy Auto 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1c;color:#fff;font-family:Arial,sans-serif}
header{padding:24px;background:linear-gradient(130deg,#30205d,#111a32)}
header h1{margin:0;color:#c8aaff}
main{max-width:600px;margin:auto;padding:14px}
.panel{background:#151e34;border:1px solid #2b3958;border-radius:16px;padding:17px;margin:13px 0}
h2{font-size:17px;margin:0 0 14px}
input,select{width:100%;padding:13px;margin:5px 0 10px;background:#0c1427;color:white;border:1px solid #394665;border-radius:9px;font-size:15px}
button{padding:12px;border:0;border-radius:9px;background:#8059ed;color:white;font-weight:bold}
.full{width:100%;margin-top:7px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card{background:#222e49;padding:12px;border-radius:10px;margin-top:9px}
small,.muted{color:#aab6d0;line-height:1.5}
.danger{background:#713b50}
#timer{text-align:center;font-size:43px;color:#c8aaff;padding:10px}
#history{font-size:13px;line-height:1.9}
</style>
</head>
<body>
<header>
<h1>✦ GALAXY AUTO</h1>
<p>Управление планетами · Версия 2.0</p>
</header>
<main>

<section class="panel">
<h2>👤 Персонаж</h2>
<input id="character" placeholder="Имя персонажа">
<button class="full" onclick="saveCharacter()">Сохранить персонажа</button>
<p class="muted" id="characterView">Персонаж не указан</p>
</section>

<section class="panel">
<h2>🌍 Планеты</h2>
<input id="planetName" placeholder="Название планеты">
<button class="full" onclick="addPlanet()">＋ Добавить планету</button>
<div id="planetList"></div>
</section>

<section class="panel">
<h2>🏆 Мониторинг рейтинга</h2>
<select id="activePlanet"></select>
<input id="rank" type="number" min="1" placeholder="Текущая позиция в рейтинге">
<button class="full" onclick="saveRank()">Сохранить позицию</button>
<p id="rankView" class="muted">Позиция пока не указана</p>
</section>

<section class="panel">
<h2>⏱ Таймер</h2>
<div id="timer">05:00</div>
<div class="row">
<button onclick="startTimer()">Запустить</button>
<button onclick="resetTimer()">Сбросить</button>
</div>
<p class="muted">Напоминание о следующем действии. Игровое поднятие выполняется вручную.</p>
</section>

<section class="panel">
<h2>📈 История поднятий</h2>
<button class="full" onclick="addHistory()">＋ Записать поднятие</button>
<div id="history"></div>
</section>

<section class="panel">
<h2>🚀 Официальная игра</h2>
<button class="full" onclick="openGame()">Открыть Галактику</button>
</section>

</main>
<script>
const $=id=>document.getElementById(id);
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let planets=get('ga2_planets',[]);
let history=get('ga2_history',[]);
let character=localStorage.getItem('ga2_character')||'';
let ranks=get('ga2_ranks',{});
let endTime=Number(localStorage.getItem('ga2_end')||0);
let tick=null;

function persist(){
localStorage.setItem('ga2_planets',JSON.stringify(planets));
localStorage.setItem('ga2_history',JSON.stringify(history));
localStorage.setItem('ga2_ranks',JSON.stringify(ranks));
}
function saveCharacter(){
character=$('character').value.trim();
localStorage.setItem('ga2_character',character);
renderCharacter();
}
function renderCharacter(){
$('character').value=character;
$('characterView').textContent=character?'Персонаж: '+character:'Персонаж не указан';
}
function addPlanet(){
let n=$('planetName').value.trim();
if(!n)return;
if(planets.some(p=>p.toLowerCase()===n.toLowerCase()))return alert('Такая планета уже есть');
planets.push(n);$('planetName').value='';
persist();renderPlanets();
}
function removePlanet(i){
planets.splice(i,1);persist();renderPlanets();
}
function renderPlanets(){
$('planetList').replaceChildren();
planets.forEach((p,i)=>{
let div=document.createElement('div');div.className='card row';
let name=document.createElement('span');name.textContent=p;
let btn=document.createElement('button');btn.className='danger';btn.textContent='Удалить';
btn.onclick=()=>removePlanet(i);
div.append(name,btn);$('planetList').append(div);
});
let select=$('activePlanet'),old=select.value;
select.replaceChildren();
planets.forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;select.append(o)});
if(planets.includes(old))select.value=old;
renderRank();
}
function saveRank(){
let p=$('activePlanet').value,r=Number($('rank').value);
if(!p||!Number.isInteger(r)||r<1)return alert('Выбери планету и введи позицию');
ranks[p]=r;persist();renderRank();
}
function renderRank(){
let p=$('activePlanet').value;
$('rankView').textContent=p&&ranks[p]?'Планета '+p+': место №'+ranks[p]:'Позиция не указана';
}
$('activePlanet').addEventListener('change',renderRank);
function addHistory(){
let p=$('activePlanet').value;
if(!p)return alert('Сначала добавь планету');
history.unshift({p,date:new Date().toLocaleString(),rank:ranks[p]||null});
history=history.slice(0,50);persist();renderHistory();
}
function renderHistory(){
$('history').replaceChildren();
history.forEach(h=>{
let div=document.createElement('div');div.className='card';
div.textContent=h.date+' — '+h.p+(h.rank?' · место №'+h.rank:'');
$('history').append(div);
});
}
function showTimer(){
let left=Math.max(0,Math.ceil((endTime-Date.now())/1000));
$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
if(left===0&&endTime){
clearInterval(tick);tick=null;endTime=0;
localStorage.removeItem('ga2_end');
alert('Пять минут прошло. Проверь игру вручную.');
}
}
function startTimer(){
if(endTime>Date.now())return;
endTime=Date.now()+300000;
localStorage.setItem('ga2_end',String(endTime));
clearInterval(tick);tick=setInterval(showTimer,500);showTimer();
}
function resetTimer(){
clearInterval(tick);tick=null;endTime=0;
localStorage.removeItem('ga2_end');$('timer').textContent='05:00';
}
function openGame(){
window.open('https://galaxy.mobstudio.ru/web/?lang=ru','_blank');
}
renderCharacter();renderPlanets();renderHistory();
if(endTime>Date.now()){tick=setInterval(showTimer,500);showTimer()}
else if(endTime){resetTimer()}
</script>
</body>
</html>
