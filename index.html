<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Auto</title>
<style>
body {
  background: #101426;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
.panel {
  background: #202944;
  padding: 25px;
  border-radius: 18px;
  max-width: 400px;
  margin: auto;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  font-size: 18px;
  color: white;
}
.start { background: #16834b; }
.stop { background: #b83242; }
</style>
</head>
<body>
<div class="panel">
<h1>🌌 Galaxy Auto</h1>
<p>Панель управления проектом</p>
<button class="start" onclick="alert('Панель запущена')">Запустить</button>
<button class="stop" onclick="alert('Панель остановлена')">Остановить</button>
<p>Статус: тестовый режим</p>
</div>
</body>
</html>
