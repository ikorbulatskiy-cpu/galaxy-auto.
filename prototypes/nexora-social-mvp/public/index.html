<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d20">
  <meta name="description" content="NEXORA — виртуальный социальный мир для общения, знакомств и новых историй.">
  <title>NEXORA — виртуальный мир</title>
  <style>
    :root{color-scheme:dark;--bg:#090d20;--panel:rgba(20,27,57,.72);--line:rgba(153,173,255,.2);--text:#f4f5ff;--muted:#aab2d2;--accent:#a88bff;--cyan:#73d9ff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 20%,rgba(87,91,190,.28),transparent 48%),radial-gradient(ellipse at 10% 85%,rgba(50,157,201,.12),transparent 38%),#090d20}
    body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none}
    body:before{opacity:.5;background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 100%),radial-gradient(2px 2px at 78% 24%,#b8c9ff 50%,transparent 100%),radial-gradient(1px 1px at 42% 72%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 88% 82%,#fff 50%,transparent 100%),radial-gradient(1px 1px at 24% 54%,#c3caff 50%,transparent 100%);background-size:330px 260px}
    body:after{background:linear-gradient(180deg,transparent 55%,rgba(4,7,19,.45))}
    main{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 18px}
    .intro{width:min(100%,760px);padding:clamp(28px,7vw,66px);text-align:center;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(25,34,72,.78),rgba(11,16,39,.78));box-shadow:0 28px 100px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.06);backdrop-filter:blur(18px)}
    .symbol{width:62px;height:62px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(177,157,255,.45);border-radius:20px;color:#d8caff;font-size:30px;background:linear-gradient(145deg,rgba(168,139,255,.22),rgba(115,217,255,.08));box-shadow:0 0 42px rgba(151,125,255,.2)}
    .eyebrow{margin:0 0 12px;color:var(--cyan);font-size:11px;font-weight:750;letter-spacing:.28em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(42px,10vw,76px);line-height:1;letter-spacing:.13em;font-weight:850;background:linear-gradient(100deg,#fff 15%,#cbbaff 55%,#8ee4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{max-width:540px;margin:22px auto 0;color:#e1e5ff;font-size:clamp(17px,3vw,22px);line-height:1.55}
    .description{max-width:560px;margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.8}
    .divider{width:70px;height:1px;margin:30px auto;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
    .note{margin:0;color:#929cbe;font-size:12px;letter-spacing:.04em}
    @media(max-width:480px){main{padding:16px}.intro{padding:36px 22px;border-radius:24px}.symbol{width:54px;height:54px;border-radius:17px;margin-bottom:20px}.lead{margin-top:18px}.description{font-size:13px}}
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="brand">
      <div class="symbol" aria-hidden="true">✦</div>
      <p class="eyebrow">ТВОЯ ВСЕЛЕННАЯ</p>
      <h1 id="brand">NEXORA</h1>
      <p class="lead">Виртуальный мир, где начинаются новые истории.</p>
      <p class="description">Знакомства, общение и исследование необычных миров. NEXORA — пространство, которое сейчас готовится к обновлению.</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="note">НОВАЯ ГЛАВА СКОРО</p>
    </section>
  </main>
</body>
</html>
