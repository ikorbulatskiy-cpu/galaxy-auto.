<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101626">
<title>NEXORA · Galaxy</title>
<link rel="stylesheet" href="/galaxy/galaxy.css?v=1">
</head>
<body>
<div class="galaxy-app">
  <header class="topbar">
    <div class="brand"><span>✦</span><div><b>NEXORA</b><small>GALAXY SOCIAL SPACE</small></div></div>
    <div class="planet-switch"><select id="planet-select" aria-label="Планета"></select><button id="rejoin" title="Перезалететь">↻</button></div>
    <button id="players-toggle" class="online">♟ <b id="online-count">0</b> <span>онлайн</span></button>
  </header>
  <main class="main">
    <section class="scene-shell">
      <div class="scene-top"><span id="room-title">Загрузка планеты…</span><span id="connection-state">Подключение</span></div>
      <div id="scene-viewport" class="scene-viewport">
        <div id="scene-world" class="scene-world">
          <div class="stars stars-a"></div><div class="stars stars-b"></div>
          <div class="nebula"></div><div class="planet-horizon"></div>
          <div class="distant-land"></div><div class="floor"><div class="floor-grid"></div></div>
          <div id="players-layer" class="players-layer"></div>
          <div id="position-cursor" class="position-cursor" hidden>⌖</div>
        </div>
        <aside id="players-panel" class="players-panel" hidden>
          <div class="panel-heading"><b>Игроки комнаты</b><button data-close="players">×</button></div>
          <div id="players-list"></div>
        </aside>
      </div>
      <div id="move-bar" class="move-bar" hidden><span>Выберите место и нажмите ОК</span><div><button id="move-cancel">Отмена</button><button id="move-confirm" class="accent">ОК</button></div></div>
      <div class="chat-panel">
        <div class="chat-heading"><b>Общий чат планеты</b><button id="chat-toggle" aria-expanded="true">Свернуть −</button></div>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <form id="chat-form" class="chat-compose"><button type="button" id="emoji-button" aria-label="Смайлы">☺</button><input id="chat-input" maxlength="1000" autocomplete="off" placeholder="Написать в чат..." required><button class="send-button" type="submit">Отправить</button></form>
      </div>
    </section>
    <nav class="actionbar">
      <button id="my-character">♙ Мой персонаж</button><button id="move-mode">⇢ Переместиться</button><button id="emote">☺ Действия / эмоции</button><button id="planet-list">✦ Планеты</button>
    </nav>
  </main>
</div>
<div id="context-menu" class="context-menu" hidden>
  <button data-action="info">Инфо</button><button data-action="move">Переместиться</button><button data-action="emote">Действия / Эмоции</button><button data-action="rejoin">Перезалететь</button>
</div>
<div id="profile-modal" class="modal" hidden><section class="modal-card"><header><b>Информация персонажа</b><button data-close="profile">×</button></header><div id="profile-content"></div></section></div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="/galaxy/galaxy.js?v=1"></script>
</body>
</html>
