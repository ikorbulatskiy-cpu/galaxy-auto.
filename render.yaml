services:
  - type: web
    name: nexora-web
    runtime: node
    plan: free
    region: frankfurt
    branch: love-galaxy-redesign
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/status
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"

databases:
  - name: nexora-postgres
    plan: free
    region: frankfurt
    databaseName: nexora
    postgresMajorVersion: "17"
    ipAllowList: []
